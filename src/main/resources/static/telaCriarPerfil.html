<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criar Perfil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="text-center mb-5">
    <h1 class="display-4 fw-bold">Criar Perfil</h1>
    <p class="text-secondary fs-5">Preencha as informações do novo perfil</p>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-9 col-xl-8">
        <div class="card-demanda card-formulario-perfil p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus mb-3 d-block"></i>
            <h5 class="fw-semibold mb-1">Dados do Perfil</h5>
            <p class="text-secondary small mb-0">Escolha o nome / status / local que será utilizado o perfil</p>
          </div>

          <form>
            <div class="row g-3">
              <div class="col-12 col-lg-6">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control campo-perfil" id="nome" name="nome" maxlength="50" placeholder="Digite o nome do perfil">
              </div>

              <div class="col-12 col-lg-6">
                <label for="local" class="form-label">Local</label>
                <input type="text" class="form-control campo-perfil" id="local" name="local" maxlength="50" placeholder="Digite o local">
              </div>

              <div class="col-12">
                <label class="form-label">Status</label>
                <div class="row g-2" role="group" aria-label="Status do perfil">
                  <div class="col-12 col-lg-4">
                    <input type="radio" class="btn-check" name="status" id="statusAtivo" value="Ativo" autocomplete="off" checked>
                    <label class="btn btn-outline-primary w-100" for="statusAtivo">Ativo</label>
                  </div>

                  <div class="col-12 col-lg-4">
                    <input type="radio" class="btn-check" name="status" id="statusInativo" value="Inativo" autocomplete="off">
                    <label class="btn btn-outline-primary w-100" for="statusInativo">Inativo</label>
                  </div>

                  <div class="col-12 col-lg-4">
                    <input type="radio" class="btn-check" name="status" id="statusArquivado" value="Arquivado" autocomplete="off">
                    <label class="btn btn-outline-primary w-100" for="statusArquivado">Arquivado</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-grid d-lg-flex justify-content-lg-end gap-2 mt-4">
              <a href="index.html" class="btn btn-outline-light px-lg-4">Voltar</a>
              <button type="button" id="btnCriarPerfil" class="btn btn-primary px-lg-4">Criar Perfil</button>
              <span id="msg-erro" class="text-danger small ms-2 align-self-center"></span>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/criarPerfil.js"></script>
</body>
</html>
